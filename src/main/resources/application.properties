### Basics
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=Codeforces Analyzer API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=REST API for Codeforces profile and problem-solving analytics.
quarkus.http.port=3000
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE
quarkus.http.cors.headers=Content-Type,Authorization

### Codeforces Credentials (provided via environment variables / .env, never committed)
codeforces.apiKey=${CODEFORCES_API_KEY}
codeforces.apiSecret=${CODEFORCES_API_SECRET}
codeforces.randomString=${CODEFORCES_RANDOM_STRING:123456}

### Search autocomplete seeding
# On startup, if the handle directory has fewer than `threshold` entries, load the
# top `limit` rated handles from the public user.ratedList so autocomplete works
# out of the box. Set enabled=false to disable.
codeforces.seed.enabled=true
codeforces.seed.limit=20000
codeforces.seed.threshold=1000

### Logging
quarkus.log.level=OFF

### MongoDB
quarkus.mongodb.connection-string=mongodb://mongodb:27017
quarkus.mongodb.database=codeforces

### Redis
quarkus.redis.hosts=redis://localhost:6379
redis.cache.ttl=3600

### REST Client URLs
org.dev.proxies.getUserInfo/mp-rest/url=https://codeforces.com/api
org.dev.proxies.getUserBlogs/mp-rest/url=https://codeforces.com/api
org.dev.proxies.getUserSubmissions/mp-rest/url=https://codeforces.com/api
