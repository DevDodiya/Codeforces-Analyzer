version: '3.8'

services:
  codeforces:
    build:
      context: .
      dockerfile: src/main/docker/Dockerfile.jvm
    image: codeforces
    depends_on:
      - mongodb
      - redis
    ports:
      - "8080:3000"
    environment:
      - JAVA_TOOL_OPTIONS=-Dquarkus.mongodb.connection-string=mongodb://mongodb:27017
      - QUARKUS_REDIS_HOSTS=redis://redis:6379
    restart: unless-stopped

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mongo_data:
  redis_data:
