server {
    listen       80;
    server_name  _;

    # Gzip for the static bundle
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    root   /usr/share/nginx/html;
    index  index.html;

    # Reverse-proxy API calls to the Quarkus backend.
    # The SPA is built with VITE_API_BASE_URL=/api, so a request to
    # /api/user-info/tourist is forwarded to the backend as /user-info/tourist.
    location /api/ {
        proxy_pass         http://codeforces:3000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Static assets: long cache (hashed filenames from Vite)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: every other path returns index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
